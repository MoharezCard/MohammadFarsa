 if(tab=='fl')return lst('files',[['t','نام فایل'],['m','توضیح (مثلاً PDF • 2MB)'],['u','لینک دانلود']]);
 if(tab=='hr')return `<div class="cd"><h3>ساعات کاری</h3>${DN.map((d,i)=>`<label>${d}</label><input data-s="days" data-i="${i}" value="${e(D.days[i]||'')}">`).join('')}</div>`+lst('book',[['t','عنوان خدمت رزرو'],['d','توضیح']]);
 if(tab=='ap')return `<div class="cd"><h3>ظاهر صفحه</h3><label>رنگ‌بندی</label><div class="sw">${PR.map((c,i)=>`<a data-a="col" data-i="${i}" style="background:linear-gradient(135deg,${c[0]},${c[1]})"></a>`).join('')}</div><div class="g2"><div><label>رنگ اصلی</label><input type="color" data-k="a" value="${D.a}"></div><div><label>رنگ دوم</label><input type="color" data-k="b" value="${D.b}"></div><div><label>تم</label><select data-k="theme"><option value="dark" ${D.theme=='dark'?'selected':''}>تاریک</option><option value="light" ${D.theme=='light'?'selected':''}>روشن</option></select></div><div><label>فونت</label><select data-k="font">${[['Vazirmatn,Tahoma,sans-serif','وزیرمتن'],['Tahoma,sans-serif','Tahoma'],['system-ui,sans-serif','سیستم']].map(([v,n])=>`<option value="${v}" ${D.font==v?'selected':''}>${n}</option>`).join('')}</select></div><div><label>زبان کارت</label><select data-k="lang"><option value="fa" ${D.lang=='fa'?'selected':''}>فارسی</option><option value="en" ${D.lang=='en'?'selected':''}>English</option></select></div></div><label>نمایش بخش‌ها</label>${[['svc','خدمات'],['port','نمونه کارها'],['prod','محصولات']].map(([k,n])=>`<div class="er"><input type="checkbox" data-s="sec" data-i="${k}" ${D.sec[k]!==0?'checked':''}> ${n}</div>`).join('')}</div>`;
 return `<div class="cd"><h3>رمز پنل</h3><label>رمز جدید (حداقل ۶ کاراکتر)</label><input type="password" id="np" autocomplete="new-password"><button class="btn o" data-a="cp">تغییر رمز</button></div><div class="cd"><h3>پیام‌های دریافتی</h3>${D.msgs.map((m,i)=>`<div class="row"><div><b>${e(m.n)}</b> <small>${e(m.p)} • ${e(m.d)}</small>${e(m.m)}</div><button class="ib" data-a="dm" data-i="${i}">✕</button></div>`).join('')||'<p class="sub">پیامی نیست.</p>'}</div>`;
}
function drawPv(){const p=$('#pv');if(p)card(p,1)}
function panel(){
 $('#app').innerHTML=`<div class="adm" dir="rtl"><nav class="side"><h2>MOHAREZ</h2>${TABS.map(([k,n])=>`<a data-a="tab" data-v="${k}" class="${k==tab?'on':''}">${n}</a>`).join('')}<a class="mpv" data-a="pv">👁 پیش‌نمایش</a><a class="lk" href="#">مشاهده کارت ↗</a><a data-a="out">🔒 خروج</a></nav><main class="mainp">${pane()}</main><aside class="pvc" id="pvc"><button class="ib cl" data-a="pv">✕ بستن</button><div class="pvw" id="pv"></div></aside></div>`;
 drawPv();
}
const H=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mz|'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const authed=()=>{try{return sessionStorage.getItem('mz_a')=='1'}catch(x){return false}};
const setAuth=v=>{try{v?sessionStorage.setItem('mz_a','1'):sessionStorage.removeItem('mz_a')}catch(x){}};
let fails=0,lock=0;
function login(){const first=!D.ph;
 $('#app').innerHTML=`<div style="max-width:420px;margin:12vh auto 0;padding:14px" dir="rtl"><div class="cd ctr"><h3>${first?'ساخت رمز پنل':'ورود به پنل'}</h3><p class="sub">${first?'برای اولین بار یک رمز انتخاب کن (حداقل ۶ کاراکتر).':'رمز عبور را وارد کن.'}</p><input type="password" id="pw" placeholder="رمز عبور" autocomplete="${first?'new-password':'current-password'}">${first?'<input type="password" id="pw2" placeholder="تکرار رمز" autocomplete="new-password">':''}<p id="er" style="color:#f43f5e;min-height:22px;margin:0 0 8px"></p><button class="btn" data-a="login">${first?'ثبت رمز':'ورود'}</button><a class="ft" href="#">← بازگشت به کارت</a></div></div>`}
async function doLogin(){const p=$('#pw').value,er=$('#er');
 if(Date.now()<lock)return er.textContent='کمی صبر کن و دوباره تلاش کن';
 if(!D.ph){if(p.length<6)return er.textContent='رمز حداقل ۶ کاراکتر باشد';if(p!=$('#pw2').value)return er.textContent='تکرار رمز یکسان نیست';D.ph=await H(p);save();setAuth(1);return route()}
 if(await H(p)==D.ph){fails=0;setAuth(1);route()}else{if(++fails>=3){lock=Date.now()+30000;fails=0}er.textContent='رمز اشتباه است'}}
function route(){apply();card($('#app'))}
const rz=(file,w,cb)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,w/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.75))};im.src=r.result};r.readAsDataURL(file)};
document.addEventListener('keydown',x=>{if(x.key=='Enter'&&x.target.id&&x.target.id.startsWith('pw'))doLogin()});
document.addEventListener('input',x=>{const t=x.target,{k,s,i,f}=t.dataset,v=t.type=='checkbox'?+t.checked:t.value;if(k)D[k]=v;else if(s)f?D[s][i][f]=v:D[s][i]=v;else return;save();apply();drawPv()});
document.addEventListener('change',x=>{const t=x.target,u=t.dataset.up;if(!u||!t.files[0])return;rz(t.files[0],u=='cover'?900:u=='avatar'?300:500,d=>{t.dataset.i===undefined?D[u]=d:D[u][t.dataset.i].img=d;save();panel()})});
document.addEventListener('click',x=>{
 const c=x.target.closest('[data-t]');if(c)track(c.dataset.t);
 const t=x.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,i=+t.dataset.i,v=t.dataset.v,rd=()=>t.closest('#pv')?drawPv():route();
 if(a=='tab'){tab=v;return panel()}
 if(a=='pv')return $('#pvc').classList.toggle('show');
 if(a=='login')return doLogin();
 if(a=='out'){setAuth(0);location.hash='';return route()}
 if(a=='cp'){const p=$('#np').value;if(p.length<6){t.textContent='حداقل ۶ کاراکتر';return}H(p).then(h=>{D.ph=h;save();$('#np').value='';t.textContent='رمز تغییر کرد ✓'});return}
 if(a=='go'){cur=v;rd();return scrollTo(0,0)}
 if(a=='flt'){flt=v;return rd()}
 if(a=='sflt'){sf=v;return rd()}
 if(a=='start'){sp=false;return rd()}
 if(a=='share'){const u=location.href.split('#')[0];track('share');navigator.share?navigator.share({url:u,title:D.nameEn}).catch(()=>{}):navigator.clipboard&&navigator.clipboard.writeText(u);return rd()}
 if(a=='vc'){track('vcard');const n=`BEGIN:VCARD\nVERSION:3.0\nFN:${D.nameEn}\nTITLE:${D.titleEn}\nTEL:${D.phone}\nEMAIL:${D.email}\nEND:VCARD`,l=document.createElement('a');l.href=URL.createObjectURL(new Blob([n],{type:'text/vcard'}));l.download='contact.vcf';l.click();return rd()}
 if(a=='send'){const q=s=>$(s).value.trim(),m={n:q('#fn'),p:q('#fp'),m:q('#fm'),d:new Date().toLocaleString('fa-IR')};if(!m.n||!m.m)return;D.msgs.unshift(m);save();t.textContent=T[D.lang].sent;location.href=`mailto:${D.email}?subject=${encodeURIComponent(m.n)}&body=${encodeURIComponent(m.m+'\n'+m.p)}`;return}
 if(a=='lang')D.lang=D.lang=='fa'?'en':'fa';
 else if(a=='th')D.theme=D.theme=='dark'?'light':'dark';
 else if(a=='col')[D.a,D.b]=PR[i];
 else if(a=='up'){if(i>0)[D.soc[i-1],D.soc[i]]=[D.soc[i],D.soc[i-1]]}
 else if(a=='add')D[v].push({t:'',d:'',p:'',c:'',img:''});
 else if(a=='del')D[v].splice(i,1);
 else if(a=='dm')D.msgs.splice(i,1);
 save();t.closest('#pv')?(apply(),drawPv()):route();
});
addEventListener('hashchange',route);
if(true){D.views++;D.vd[dk()]=(D.vd[dk()]||0)+1;save()}
route();remote().then(route);
</script></body></html>
