<!DOCTYPE html>
<html lang="fa" dir="rtl"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Moharez Digital Card</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#050912;--surface:#0a1120;--surface2:#0e1626;--surface3:#121b30;
  --border:#1b2842;--border2:#243254;
  --accent:#3b82f6;--accent2:#22d3ee;
  --text:#f1f5f9;--muted:#5b6b8a;--muted2:#8b9bbd;
  --green:#22c55e;--red:#ef4444;--orange:#f97316;
  --vaz:'Vazirmatn',sans-serif;--mono:'JetBrains Mono',monospace;
  --radius:24px;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--vaz);min-height:100vh;min-height:100dvh;overflow-x:hidden;}
body{display:flex;justify-content:center;}
.app{position:relative;width:100%;max-width:430px;min-height:100vh;min-height:100dvh;background:var(--app-bg,var(--surface));overflow:hidden;}

/* ===== Responsive scaling for wider viewports (no device-frame look) ===== */
@media (min-width:700px){
  .app{max-width:640px;}
  .hero{padding:34px 40px 6px;}
  .content{padding:8px 40px 34px;}
  .menu-grid{grid-template-columns:repeat(4,1fr);}
  .svc-grid{grid-template-columns:repeat(3,1fr);}
  .home-hdr{padding:24px 40px 0;}
}
@media (min-width:1000px){
  .app{max-width:860px;}
  .hero{padding:40px 64px 8px;}
  .content{padding:8px 64px 40px;}
  .menu-grid{grid-template-columns:repeat(5,1fr);}
  .svc-grid{grid-template-columns:repeat(4,1fr);}
  .home-hdr{padding:26px 64px 0;}
  .quick-row{gap:16px;}
  .q-item{width:66px;}
  .q-circle{width:58px;height:58px;}
}

/* Decorative wave/glow behind home hero */
.wave-bg{position:absolute;top:0;left:0;right:0;height:340px;pointer-events:none;overflow:hidden;z-index:0;}
.wave-bg svg{position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:130%;opacity:.55;}
.wave-bg::after{content:'';position:absolute;inset:0;background:radial-gradient(320px at 50% 15%,rgba(59,130,246,.18) 0%,transparent 70%);}

/* Screens */
.screen{position:absolute;inset:0;background:var(--surface);
  transform:translateX(0);transition:transform .38s cubic-bezier(.22,1,.36,1),opacity .3s;
  display:flex;flex-direction:column;z-index:1;}
.screen.sub{transform:translateX(110%);}
.screen.sub.active{transform:translateX(0);z-index:5;}
.screen.home{z-index:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:transparent;}
.app.sub-open .screen.home{transform:translateX(-12%);filter:brightness(.6);}

/* Status bar spacer (purely visual, mimics phone) */
.statusbar{height:14px;}

/* Header for sub-screens */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px;position:relative;z-index:2;}
.hdr-btn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;flex-shrink:0;transition:background .15s;}
.hdr-btn:hover{background:rgba(255,255,255,.09);}
.hdr-btn svg{width:17px;height:17px;}
.hdr-title{font-weight:800;font-size:15px;letter-spacing:.04em;}
.hdr-spacer{width:38px;}

.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 20px 28px;position:relative;z-index:1;}
.content::-webkit-scrollbar{display:none;}

.page-title{font-size:19px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
.page-title svg{width:19px;height:19px;color:var(--accent);}
.page-sub{font-size:12px;color:var(--muted2);margin-bottom:20px;line-height:1.7;}

/* ===== HOME ===== */
.home-hdr{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 0;position:relative;z-index:2;}
.brand{display:flex;flex-direction:column;}
.brand-name{font-family:var(--mono);font-weight:700;font-size:18px;letter-spacing:.08em;background:linear-gradient(90deg,#fff,var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.brand-tag{font-size:10px;color:var(--muted2);letter-spacing:.06em;margin-top:1px;}
.home-actions{display:flex;gap:8px;}

.hero{position:relative;z-index:1;padding:26px 28px 6px;text-align:center;}
.avatar-wrap{position:relative;width:118px;height:118px;margin:0 auto 16px;}
.avatar-ring{width:100%;height:100%;border-radius:50%;padding:4px;
  background:conic-gradient(from 180deg,var(--accent),var(--accent2),var(--accent));
  box-shadow:0 0 40px rgba(59,130,246,.35);}
.avatar-ring>div,.avatar-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:top center;
  display:flex;align-items:center;justify-content:center;background:#0d1526;border:3px solid var(--surface);}
.verified-badge{position:absolute;bottom:2px;left:2px;width:26px;height:26px;border-radius:50%;
  background:var(--accent);border:3px solid var(--surface);display:flex;align-items:center;justify-content:center;}
.verified-badge svg{width:12px;height:12px;color:#fff;}
.h-name{font-size:22px;font-weight:800;color:var(--hero-name,var(--text));}
.h-role{font-size:12.5px;color:var(--hero-job,var(--accent2));font-weight:500;margin-top:4px;}
.h-tagline{font-size:12px;color:var(--hero-bio,var(--muted2));margin-top:10px;line-height:1.8;max-width:300px;margin-inline:auto;}

.quick-row{display:flex;justify-content:center;gap:10px;margin-top:22px;flex-wrap:wrap;}
.q-item{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:56px;}
.q-circle{width:52px;height:52px;border-radius:16px;background:var(--surface2);border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;color:var(--accent2);transition:transform .15s,border-color .15s;text-decoration:none;}
.q-circle:active{transform:scale(.92);}
.q-circle:hover{transform:translateY(-2px);border-color:var(--accent);}
.q-circle svg{width:20px;height:20px;}
.q-label{font-size:9px;color:var(--muted2);white-space:nowrap;}

.save-btn{margin:24px 4px 0;display:flex;align-items:center;justify-content:center;gap:9px;
  padding:15px;border-radius:15px;border:none;cursor:pointer;width:100%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  font-family:var(--vaz);font-size:14.5px;font-weight:700;box-shadow:0 10px 30px rgba(59,130,246,.3);}
.save-btn svg{width:17px;height:17px;}

.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:26px;}
.menu-item{display:flex;flex-direction:column;align-items:center;gap:7px;padding:16px 6px;
  background:var(--surface2);border:1px solid var(--border);border-radius:16px;cursor:pointer;transition:border-color .15s,transform .15s;}
.menu-item:hover{border-color:var(--accent);transform:translateY(-2px);}
.menu-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;}
.menu-icon svg{width:18px;height:18px;}
.menu-label{font-size:10.5px;font-weight:600;color:var(--text);text-align:center;}

.foot{text-align:center;padding:22px 0 10px;font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.08em;}
.foot b{color:var(--accent2);}

/* ===== Contact rows ===== */
.info-row{display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:15px;
  background:var(--surface2);border:1px solid var(--border);color:var(--text);margin-bottom:10px;}
.info-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;text-decoration:none;transition:transform .15s,filter .15s;}
.info-icon:active{transform:scale(.92);}
.info-icon svg{width:17px;height:17px;}
.info-label{font-size:10px;color:var(--muted2);margin-bottom:2px;}
.info-value{font-size:13.5px;font-weight:600;}
.row-arrow{margin-inline-start:auto;color:var(--muted);}
.row-arrow svg{width:15px;height:15px;}

.qr-box{margin-top:6px;padding:18px;border-radius:16px;background:var(--surface2);border:1px dashed var(--border2);
  display:flex;align-items:center;gap:16px;}
.qr-img{width:76px;height:76px;border-radius:10px;background:#fff;padding:5px;flex-shrink:0;}
.qr-img img{width:100%;height:100%;display:block;}
.qr-text b{font-size:13px;display:block;margin-bottom:3px;}
.qr-text span{font-size:11px;color:var(--muted2);line-height:1.7;}

/* ===== About ===== */
.about-card{background:var(--surface2);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:16px;}
.about-bio{font-size:13px;line-height:2;color:var(--muted2);}
.stat-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border);}
.stat-row:last-child{border-bottom:none;}
.stat-label{font-size:12.5px;color:var(--muted2);display:flex;align-items:center;gap:9px;}
.stat-label svg{width:15px;height:15px;color:var(--accent2);}
.stat-value{font-size:12.5px;font-weight:700;}
.skill-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:60%;}
.skill-tag{font-size:10px;padding:3px 9px;border-radius:100px;background:rgba(59,130,246,.1);color:var(--accent2);border:1px solid rgba(59,130,246,.2);}
.resume-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;
  border-radius:14px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);
  font-family:var(--vaz);font-size:13.5px;font-weight:700;cursor:pointer;}
.resume-btn svg{width:16px;height:16px;color:var(--accent2);}

/* ===== Services ===== */
.svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.svc-card{background:var(--surface2);border:1px solid var(--border);border-radius:17px;padding:16px 14px;}
.svc-icon{width:40px;height:40px;border-radius:12px;background:rgba(59,130,246,.12);color:var(--accent2);
  display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.svc-icon svg{width:19px;height:19px;}
.svc-title{font-size:13px;font-weight:700;margin-bottom:4px;}
.svc-sub{font-size:10.5px;color:var(--muted2);line-height:1.6;}

/* ===== Portfolio ===== */
.pf-card{display:flex;align-items:center;gap:13px;background:var(--surface2);border:1px solid var(--border);
  border-radius:16px;padding:12px;margin-bottom:10px;text-decoration:none;color:var(--text);}
.pf-thumb{width:60px;height:60px;border-radius:11px;background:linear-gradient(135deg,var(--surface3),var(--border2));
  flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden;}
.pf-thumb img{width:100%;height:100%;object-fit:cover;}
.pf-thumb svg{width:22px;height:22px;}
.pf-title{font-size:13.5px;font-weight:700;margin-bottom:5px;}
.pf-tags{display:flex;gap:5px;flex-wrap:wrap;}

/* ===== Portfolio detail modal (bottom sheet) ===== */
.pf-modal{position:absolute;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);opacity:0;transition:opacity .25s ease;}
.pf-modal.show{display:flex;opacity:1;}
.pf-modal-sheet{width:100%;max-height:88%;background:var(--surface);border-radius:24px 24px 0 0;overflow-y:auto;position:relative;transform:translateY(24px);transition:transform .25s ease;box-shadow:0 -20px 50px -15px rgba(0,0,0,.5);}
.pf-modal.show .pf-modal-sheet{transform:translateY(0);}
.pf-modal-close{position:absolute;top:14px;left:14px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;color:#fff;z-index:2;}
.pf-modal-img{width:100%;height:220px;background:linear-gradient(135deg,var(--surface3),var(--border2));display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden;}
.pf-modal-img img{width:100%;height:100%;object-fit:cover;}
.pf-modal-noimg{display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
.pf-modal-body{padding:20px;}
.pf-modal-title{font-size:16.5px;font-weight:800;margin-bottom:10px;}
.pf-modal-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.pf-modal-desc{font-size:13px;line-height:2;color:var(--muted2);margin-bottom:18px;white-space:pre-wrap;}
.pf-modal-link{display:none;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:13px;background:var(--accent);color:#fff;font-weight:700;font-size:13px;text-decoration:none;}

.pf-tag{font-size:9.5px;color:var(--muted2);background:rgba(255,255,255,.04);padding:2px 7px;border-radius:6px;}

/* ===== Location ===== */
.map-box{position:relative;height:190px;border-radius:18px;overflow:hidden;margin-bottom:16px;
  background:
    radial-gradient(circle at 30% 20%,rgba(59,130,246,.12) 0,transparent 45%),
    linear-gradient(160deg,#0c1424,#101c33);
  border:1px solid var(--border);}
.map-box::before{content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:26px 26px;}
.map-pin{position:absolute;top:50%;left:50%;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;}
.map-pin-icon{width:38px;height:38px;border-radius:50% 50% 50% 0;background:var(--accent);transform:rotate(-45deg);
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(59,130,246,.45);}
.map-pin-icon svg{width:16px;height:16px;color:#fff;transform:rotate(45deg);}
.map-label{margin-top:10px;background:var(--surface);border:1px solid var(--border2);border-radius:10px;
  padding:6px 12px;font-size:11px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.3);}
.map-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:15px;
  border-radius:14px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  font-family:var(--vaz);font-size:13.5px;font-weight:700;cursor:pointer;}
.map-btn svg{width:16px;height:16px;}

/* ===== Theme picker ===== */
.swatch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px;}
.swatch{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:16px;
  border:2px solid var(--border);cursor:pointer;background:var(--surface2);transition:border-color .15s;}
.swatch.selected{border-color:var(--accent);background:rgba(59,130,246,.08);}
.swatch-dot{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.12);}
.swatch-name{font-size:10.5px;color:var(--muted2);font-weight:600;}
.mini-preview{background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:16px;
  display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.mini-avatar{width:46px;height:46px;border-radius:50%;flex-shrink:0;overflow:hidden;background:#0d1526;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--border2);}
.mini-avatar img{width:100%;height:100%;object-fit:cover;}
.mini-info b{font-size:13px;display:block;}
.mini-info span{font-size:10.5px;color:var(--muted2);}
.theme-save-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;
  border-radius:14px;border:none;color:#fff;font-family:var(--vaz);font-size:13.5px;font-weight:700;cursor:pointer;}
.theme-save-btn svg{width:16px;height:16px;}

/* ===== Social list ===== */
.soc-row{display:flex;align-items:center;gap:14px;padding:15px 16px;border-radius:15px;
  background:var(--surface2);border:1px solid var(--border);color:var(--text);margin-bottom:10px;}
.soc-row .info-icon{width:36px;height:36px;}
.soc-handle{font-size:11px;color:var(--muted2);margin-top:2px;}

/* Empty state */
.empty-state{text-align:center;padding:50px 20px;color:var(--muted2);}
.empty-state svg{width:40px;height:40px;color:var(--muted);margin-bottom:12px;}
.empty-state p{font-size:12.5px;line-height:1.8;}

.load-state{padding:80px 30px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted2);}

/* Theme toggle (page-level light/dark, independent of accent color) — lives inline in the header row now */
.theme-toggle svg{width:16px;height:16px;}

body.light{--bg:#f3f5f9;--surface:#ffffff;--surface2:#f4f6fa;--surface3:#e9edf4;--border:#e2e6ee;--border2:#d3d9e4;--text:#0f172a;--muted:#9aa5b8;--muted2:#5c6b85;}
body.light .brand-name{background:linear-gradient(90deg,#0f172a,var(--accent));-webkit-background-clip:text;background-clip:text;}
body.light .hdr-btn,body.light .q-circle{background:#fff;box-shadow:0 1px 4px rgba(15,23,42,.06);}
body.light .qr-img{background:#fff;box-shadow:0 1px 4px rgba(15,23,42,.1);}
</style></head>
<body>
<script>if(localStorage.getItem('moharez_card_theme')==='light')document.body.classList.add('light');</script>

<div class="app" id="app">
  <div class="screen home" id="screen-home">
    <div class="load-state" id="loadState">در حال بارگذاری کارت...</div>
  </div>
</div>

function icon(name, size){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="${size||18}" height="${size||18}">${ICONS[name]||''}</svg>`; }
function iconFill(name, size){ return `<svg viewBox="0 0 24 24" fill="currentColor" width="${size||18}" height="${size||18}">${ICONS[name]||''}</svg>`; }
function esc(s){ return s==null?'':String(s); }
function openApp(appUrl, webUrl){
  const start = Date.now();
  let left = false;
  const onBlur = () => { left = true; };
  window.addEventListener('blur', onBlur, {once:true});
  try{ window.location.href = appUrl; }catch(e){}
  setTimeout(()=>{
    window.removeEventListener('blur', onBlur);
    if(!left && Date.now()-start < 1700 && webUrl){ window.open(webUrl, '_blank'); }
  }, 1200);
}
function themeToggleHTML(){
  return `<div class="hdr-btn theme-toggle" onclick="togglePageTheme()"><svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg></div>`;
}

let CARD_DATA = null;
let CUSTOM_APP_BG = null;
let CUSTOM_TEXT_COLORS = null;
function applyCustomBackground(){
  const isLight = document.body.classList.contains('light');
  if(isLight || !CUSTOM_APP_BG){
    document.documentElement.style.removeProperty('--app-bg');
  } else {
    document.documentElement.style.setProperty('--app-bg', CUSTOM_APP_BG);
  }
  const vars = {name:'--hero-name', job:'--hero-job', bio:'--hero-bio'};
  Object.keys(vars).forEach(k=>{
    const cssVar = vars[k];
    if(isLight || !CUSTOM_TEXT_COLORS || !CUSTOM_TEXT_COLORS[k]){
      document.documentElement.style.removeProperty(cssVar);
    } else {
      document.documentElement.style.setProperty(cssVar, CUSTOM_TEXT_COLORS[k]);
    }
  });
}

fetch('data.json', {cache:'no-store'})
  .then(r => { if(!r.ok) throw new Error('no data'); return r.json(); })
  .then(data => { CARD_DATA = data; boot(data); })
  .catch(() => {
    document.getElementById('loadState').innerHTML = 'اطلاعات کارت پیدا نشد.<br/>data.json کنار index.html باشه.';
  });

function boot(data){
  const theme = data.theme || {};
  const preset = ACCENT_PRESETS[theme.accentPreset] || ACCENT_PRESETS.blue;
  applyAccent(preset.a, preset.a2);
  if(theme.cardColor) document.documentElement.style.setProperty('--surface', theme.cardColor);
  if(theme.bgMode === 'diagonal' && theme.bgColor1 && theme.bgColor2){
    const angle = theme.bgAngle || 135;
    CUSTOM_APP_BG = `linear-gradient(${angle}deg, ${theme.bgColor1} 50%, ${theme.bgColor2} 50%)`;
  } else if(theme.cardColor){
    CUSTOM_APP_BG = theme.cardColor;
  }
  if(theme.textMode === 'custom'){
    CUSTOM_TEXT_COLORS = { name: theme.nameColor, job: theme.jobColor, bio: theme.bioColor };
  }
  applyCustomBackground();

  if(data.toggles && data.toggles.maintenance === true){
    document.getElementById('app').innerHTML = `
      <div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 28px;gap:16px;">
        <div style="width:64px;height:64px;border-radius:20px;background:var(--surface2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;color:var(--accent2);">${icon('design',30)}</div>
        <div style="font-size:16px;font-weight:800;">${esc(data.name||'')}</div>
        <div style="font-size:13.5px;color:var(--muted2);line-height:2;max-width:280px;">این صفحه در حال به‌روزرسانی است.<br/>لطفاً کمی بعد دوباره سر بزنید.</div>
      </div>`;
    return;
  }

  const app = document.getElementById('app');
  app.innerHTML = buildHomeHTML(data) + buildSubScreensHTML(data) + portfolioModalHTML();
  wireUp(data);
  updatePageThemeIcon();
}

function applyAccent(a, a2){
  document.documentElement.style.setProperty('--accent', a);
  document.documentElement.style.setProperty('--accent2', a2);
}

// ───────────────────────── HOME ─────────────────────────
function buildHomeHTML(data){
  const name = data.name || '';
  const job = data.job || '';
  const bio = data.bio || '';
  const t = data.toggles || {};
  const photo = data.photoBase64
    ? `<img src="${photo_esc(data.photoBase64)}"/>`
    : `<div>${icon('user',34)}</div>`;

  const phones = (data.phones||[]).filter(p=>p&&p.value);
  const emails = (data.emails||[]).filter(e=>e&&e.value);
  const social = data.social || {};
  const quickItems = [];
  if(phones[0]) quickItems.push({href:`tel:${phones[0].value}`, ic:icon('phone'), label:'تماس', bg:'#22c55e'});
  if(t.email!==false && emails[0]) quickItems.push({href:`mailto:${emails[0].value}`, ic:icon('mail'), label:'ایمیل', bg:'#f97316'});
  if(social.telegram) quickItems.push({href:`https://t.me/${social.telegram}`, appUrl:`tg://resolve?domain=${social.telegram}`, ic:iconFill('telegram'), label:'تلگرام', bg:'#29B6F6'});
  if(social.instagram) quickItems.push({href:`https://instagram.com/${social.instagram}`, appUrl:`instagram://user?username=${social.instagram}`, ic:iconFill('instagram'), label:'اینستاگرام', bg:'linear-gradient(45deg,#f9ce34,#ee2a7b 45%,#6228d7)'});
  if(social.whatsapp){ const num=social.whatsapp.replace(/\D/g,''); quickItems.push({href:`https://wa.me/${num}`, appUrl:`whatsapp://send?phone=${num}`, ic:iconFill('whatsapp'), label:'واتساپ', bg:'#25D366'}); }

  const menuDefs = [
    { key:'contact',  label:'اطلاعات تماس', icon:'phone', color:'rgba(59,130,246,.12)', fg:'#3b82f6', show:true },
    { key:'about',    label:'درباره من',    icon:'user',  color:'rgba(139,92,246,.12)', fg:'#8b5cf6', show:t.about!==false },
    { key:'services', label:'خدمات',        icon:'briefcase', color:'rgba(34,197,94,.12)', fg:'#22c55e', show:t.services!==false && (data.services||[]).length>0 },
    { key:'portfolio',label:'نمونه‌کارها',   icon:'image', color:'rgba(249,115,22,.12)', fg:'#f97316', show:t.portfolio!==false && (data.portfolio||[]).length>0 },
    { key:'location', label:'موقعیت مکانی', icon:'pin',   color:'rgba(236,72,153,.12)', fg:'#ec4899', show:t.location!==false && data.location && data.location.city },
    { key:'social',   label:'شبکه‌های اجتماعی', icon:'share', color:'rgba(34,211,238,.12)', fg:'#22d3ee', show:t.social!==false },
    { key:'theme',    label:'تم رنگی',      icon:'design', color:'rgba(148,163,184,.12)', fg:'#94a3b8', show:t.themePicker!==false }
  ].filter(m=>m.show);

  const menuHTML = menuDefs.map(m=>`
    <div class="menu-item" onclick="openScreen('${m.key}')">
      <div class="menu-icon" style="background:${m.color};color:${m.fg};">${icon(m.icon,18)}</div>
      <div class="menu-label">${m.label}</div>
    </div>`).join('');

  return `
  <div class="screen home" id="screen-home">
    <div class="wave-bg">${waveSVG()}</div>
    <div class="home-hdr">
      <div class="brand">
        <div class="brand-name">MOHAREZ</div>
        <div class="brand-tag">Smart Business Card</div>
      </div>
      <div class="home-actions">
        ${t.shareButton!==false ? `<div class="hdr-btn" onclick="shareCard()">${icon('share',16)}</div>` : ''}
        ${themeToggleHTML()}
      </div>
    </div>
    <div class="hero">
      <div class="avatar-wrap">
        <div class="avatar-ring">${photo}</div>
        ${data.verified ? `<div class="verified-badge">${icon('check',12)}</div>` : ''}
      </div>
      <div class="h-name">${esc(name)}</div>
      <div class="h-role">${esc(job)}</div>
      ${(t.bio!==false && bio) ? `<div class="h-tagline">${esc(bio)}</div>` : ''}
      <div class="quick-row">
        ${quickItems.map(q=>`<div class="q-item"><a class="q-circle" href="${q.href}" ${q.appUrl?`onclick="openApp('${q.appUrl}','${q.href}');return false;"`:'target="_blank"'} style="background:${q.bg};color:#fff;">${q.ic}</a><div class="q-label">${q.label}</div></div>`).join('')}
      </div>
      ${t.vcard!==false ? `<button class="save-btn" onclick="saveContact()">${icon('userAdd',17)}<span>افزودن به مخاطبین</span></button>` : ''}
      <div class="menu-grid">${menuHTML}</div>
    </div>
    <div class="foot">Powered by <b>MOHAREZ</b></div>
  </div>`;
}
function photo_esc(p){ return p; }
function waveSVG(){
  return `<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,120 C80,60 150,180 250,100 C320,50 380,90 400,60 L400,0 L0,0 Z" fill="var(--accent)" opacity="0.10"/>
    <path d="M0,160 C100,110 180,220 280,150 C340,110 380,150 400,120 L400,0 L0,0 Z" fill="var(--accent2)" opacity="0.08"/>
  </svg>`;
}

function buildSubScreensHTML(data){
  return `
  <div class="screen sub" id="screen-contact">${headerHTML('اطلاعات تماس', data)}<div class="content">${contactContent(data)}</div></div>
  <div class="screen sub" id="screen-about">${headerHTML('درباره من', data)}<div class="content">${aboutContent(data)}</div></div>

  <div class="screen sub" id="screen-social">${headerHTML('شبکه‌های اجتماعی', data)}<div class="content">${socialContent(data)}</div></div>
  <div class="screen sub" id="screen-theme">${headerHTML('انتخاب تم رنگی', data)}<div class="content">${themeContent(data)}</div></div>
  `;
}
function headerHTML(title, data){
  const shareOn = !data || data.toggles?.shareButton !== false;
  return `<div class="hdr">
    <div class="hdr-btn" onclick="closeScreen()">${icon('back',17)}</div>
    <div class="hdr-title">${title}</div>
    <div style="display:flex;gap:8px;">
      ${shareOn ? `<div class="hdr-btn" onclick="shareCard()">${icon('share',15)}</div>` : ''}
      ${themeToggleHTML()}
    </div>
  </div>`;
}

function contactContent(data){
  const phones = (data.phones||[]).filter(p=>p&&p.value);
  const emails = (data.emails||[]).filter(e=>e&&e.value);
  const websites = (data.websites||[]).filter(w=>w&&w.value);
  const loc = data.location||{};
  let rows = '';
  phones.forEach(p=> rows += `<div class="info-row"><a class="info-icon" href="tel:${p.value}" style="background:rgba(34,197,94,.12);color:#22c55e;">${icon('phone',16)}</a><div><div class="info-label">${esc(p.label)}</div><div class="info-value">${esc(p.value)}</div></div></div>`);
  if(data.toggles?.email !== false) emails.forEach(e=> rows += `<div class="info-row"><a class="info-icon" href="mailto:${e.value}" style="background:rgba(249,115,22,.12);color:#f97316;">${icon('mail',16)}</a><div><div class="info-label">${esc(e.label)}</div><div class="info-value">${esc(e.value)}</div></div></div>`);
  if(data.toggles?.website !== false) websites.forEach(w=> rows += `<div class="info-row"><a class="info-icon" href="${/^https?:\/\//.test(w.value)?w.value:'https://'+w.value}" target="_blank" style="background:rgba(59,130,246,.12);color:#3b82f6;">${icon('link',16)}</a><div><div class="info-label">${esc(w.label)||'وبسایت'}</div><div class="info-value">${esc(w.value)}</div></div></div>`);
  if(loc.city) rows += `<div class="info-row"><a class="info-icon" href="${mapHref(data)}" target="_blank" style="background:rgba(236,72,153,.12);color:#ec4899;">${icon('pin',16)}</a><div><div class="info-label">آدرس</div><div class="info-value">${esc(loc.city)}</div></div></div>`;
  if(!rows) rows = emptyState('راهی برای تماس ثبت نشده.');
  const qrData = encodeURIComponent(location.href);
  return `
    <p class="page-sub">به راحتی با من در ارتباط باشید</p>
    ${rows}
    ${data.toggles && data.toggles.vcard!==false ? `<button class="save-btn" style="margin-top:14px;" onclick="saveContact()">${icon('userAdd',16)}<span>ذخیره مخاطب</span></button>` : ''}
    <div class="qr-box">
      <div class="qr-img"><img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${qrData}" alt="QR"/></div>
      <div class="qr-text"><b>کد QR</b><span>اسکن کنید تا اطلاعات من رو راحت‌تر دریافت کنید</span></div>
    </div>`;
}

function aboutContent(data){
  const about = data.about || {};
  const bio = data.bio || '';
  const skills = about.skills || [];
  return `
    <div class="about-card"><p class="about-bio">${esc(bio) || 'بیوگرافی هنوز ثبت نشده.'}</p></div>
    <div class="about-card">
      <div class="stat-row"><span class="stat-label">${icon('award',15)}مهارت‌ها</span><div class="skill-tags">${skills.map(s=>`<span class="skill-tag">${esc(s)}</span>`).join('')}</div></div>
      <div class="stat-row"><span class="stat-label">${icon('briefcase',15)}تجربه کاری</span><span class="stat-value">${esc(about.experience)||'—'}</span></div>
      <div class="stat-row"><span class="stat-label">${icon('book',15)}تحصیلات</span><span class="stat-value">${esc(about.education)||'—'}</span></div>
    </div>
    ${about.resumeLink ? `<a class="resume-btn" href="${about.resumeLink}" target="_blank" style="text-decoration:none;">${icon('download',15)}<span>دانلود رزومه</span></a>` : ''}`;
}

function servicesContent(data){
  const services = data.services || [];
  if(!services.length) return emptyState('هنوز خدمتی ثبت نشده.');
  return `
    <p class="page-sub">راهکارهای دیجیتال برای رشد کسب‌وکار شما</p>
    <div class="svc-grid">
      ${services.map(s=>`
        <div class="svc-card">
          <div class="svc-icon">${icon(SVC_ICON[s.icon]||'code',18)}</div>
          <div class="svc-title">${esc(s.title)}</div>
          <div class="svc-sub">${esc(s.subtitle)}</div>
        </div>`).join('')}
    </div>`;
}

function portfolioContent(data){
  const items = data.portfolio || [];
  if(!items.length) return emptyState('هنوز نمونه‌کاری ثبت نشده.');
  return items.map((p,i)=>`
    <div class="pf-card" onclick="openPortfolioDetail(${i})">
      <div class="pf-thumb">${p.image ? `<img src="${p.image}"/>` : icon('image',22)}</div>
      <div style="flex:1;min-width:0;">
        <div class="pf-title">${esc(p.title)}</div>
        <div class="pf-tags">${(p.tags||[]).map(t=>`<span class="pf-tag">${esc(t)}</span>`).join('')}</div>
      </div>
      <div class="row-arrow">${icon('chevron',15)}</div>
    </div>`).join('');
}
function portfolioModalHTML(){
  return `<div class="pf-modal" id="pfModal">
    <div class="pf-modal-sheet" id="pfModalSheet">
      <div class="pf-modal-close" onclick="closePortfolioDetail()">${icon('close',16)}</div>
      <div class="pf-modal-img" id="pfModalImg"></div>
      <div class="pf-modal-body">
        <div class="pf-modal-title" id="pfModalTitle"></div>
        <div class="pf-modal-tags" id="pfModalTags"></div>
        <div class="pf-modal-desc" id="pfModalDesc"></div>
        <a class="pf-modal-link" id="pfModalLink" href="#" target="_blank">${icon('extLink',15)}<span>مشاهده لینک</span></a>
      </div>
    </div>
  </div>`;
}
function openPortfolioDetail(i){
  const p = (CARD_DATA.portfolio || [])[i];
  if(!p) return;
  const imgEl = document.getElementById('pfModalImg');
  imgEl.innerHTML = p.image ? `<img src="${p.image}"/>` : `<div class="pf-modal-noimg">${icon('image',34)}</div>`;
  document.getElementById('pfModalTitle').textContent = p.title || '';
  document.getElementById('pfModalTags').innerHTML = (p.tags||[]).map(t=>`<span class="pf-tag">${esc(t)}</span>`).join('');
  const descEl = document.getElementById('pfModalDesc');
  descEl.textContent = p.description || '';
  descEl.style.display = p.description ? 'block' : 'none';
  const linkEl = document.getElementById('pfModalLink');
  if(p.link){ linkEl.href = p.link; linkEl.style.display = 'flex'; } else { linkEl.style.display = 'none'; }
  document.getElementById('pfModal').classList.add('show');
}
function closePortfolioDetail(){
  document.getElementById('pfModal').classList.remove('show');
}

function mapHref(data){
  const loc = data.location || {};
  return loc.mapLink || `https://maps.google.com/?q=${encodeURIComponent((loc.city||'')+' '+(loc.address||''))}`;
}
function locationContent(data){
  const loc = data.location || {};
  if(!loc.city) return emptyState('موقعیت مکانی ثبت نشده.');
  return `
    <p class="page-sub">در صورت نیاز، به صورت حضوری مراجعه کنید</p>
    <div class="map-box">
      <div class="map-pin"><div class="map-pin-icon">${icon('pin',15)}</div>
      <div class="map-label">${esc(loc.city)}${loc.address?' — '+esc(loc.address):''}</div></div>
    </div>
    <button class="map-btn" onclick="window.open('${mapHref(data)}','_blank')">${icon('pin',15)}<span>مشاهده در گوگل مپس</span></button>`;
}

function socialContent(data){
  const s = data.social || {};
  const defs = [
    { key:'instagram', label:'Instagram', url:`https://instagram.com/${s.instagram}`, appUrl:`instagram://user?username=${s.instagram}`, ic:'instagram', fill:true, color:'#E91E8C' },
    { key:'telegram',  label:'Telegram',  url:`https://t.me/${s.telegram}`, appUrl:`tg://resolve?domain=${s.telegram}`, ic:'telegram', fill:true, color:'#29B6F6' },
    { key:'whatsapp',  label:'WhatsApp',  url:`https://wa.me/${(s.whatsapp||'').replace(/\D/g,'')}`, appUrl:`whatsapp://send?phone=${(s.whatsapp||'').replace(/\D/g,'')}`, ic:'whatsapp', fill:true, color:'#25D366' },
    { key:'github',    label:'GitHub',    url:`https://github.com/${s.github}`, ic:'github', fill:true, color:'#C9D1D9' },
    { key:'linkedin',  label:'LinkedIn',  url:`https://linkedin.com/in/${s.linkedin}`, ic:'linkedin', fill:true, color:'#0a66c2' },
    { key:'twitter',   label:'X (Twitter)', url:`https://x.com/${s.twitter}`, ic:'twitter', fill:true, color:'#e7e9ea' }
  ].filter(d => s[d.key]);
  if(!defs.length) return emptyState('شبکه اجتماعی ثبت نشده.');
  return defs.map(d=>`
    <div class="soc-row">
      <a class="info-icon" href="${d.url}" ${d.appUrl?`onclick="openApp('${d.appUrl}','${d.url}');return false;"`:'target="_blank"'} style="background:${d.color}22;color:${d.color};">${iconFill(d.ic,17)}</a>
      <div><div class="info-value">${d.label}</div><div class="soc-handle">@${esc(s[d.key])}</div></div>
    </div>`).join('');

function themeContent(data){
  const theme = data.theme || {};
  const current = theme.accentPreset || 'blue';
  const name = data.name||'', job = data.job||'';
  const photo = data.photoBase64 ? `<img src="${data.photoBase64}"/>` : icon('user',18);
  const swatches = Object.keys(ACCENT_PRESETS).map(key=>{
    const p = ACCENT_PRESETS[key];
    return `<div class="swatch ${key===current?'selected':''}" data-preset="${key}" onclick="pickPreset('${key}')">
      <div class="swatch-dot" style="background:${p.a};"></div>
      <div class="swatch-name">${p.name}</div>
    </div>`;
  }).join('');
  return `
    <p class="page-sub">رنگ مورد علاقه خود را انتخاب کنید</p>
    <div class="swatch-grid" id="swatchGrid">${swatches}</div>
    <div class="mini-preview">
      <div class="mini-avatar">${photo}</div>
      <div class="mini-info"><b>${esc(name)}</b><span>${esc(job)}</span></div>
    </div>
    <button class="theme-save-btn" id="themeSaveBtn" onclick="confirmThemeChoice()" style="background:linear-gradient(135deg,var(--accent),var(--accent2));">${icon('check',15)}<span>ذخیره تغییرات</span></button>
    <p style="font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:12px;line-height:1.8;">این انتخاب فقط روی نمایش همین مرورگر شماست. برای تغییر دائمی رنگ کارت، از پنل مدیریت استفاده کنید.</p>`;
}

function emptyState(msg){
  return `<div class="empty-state">${icon('image',36)}<p>${msg}</p></div>`;
}

// ───────────────────────── Navigation ─────────────────────────
function openScreen(key){
  const el = document.getElementById('screen-'+key);
  if(!el) return;
  document.getElementById('app').classList.add('sub-open');
  el.classList.add('active');
}
function closeScreen(){
  document.getElementById('app').classList.remove('sub-open');
  document.querySelectorAll('.screen.sub.active').forEach(s=>s.classList.remove('active'));
}
function shareCard(){
  const url = location.href;
  if(navigator.share){ navigator.share({title:document.title, url}).catch(()=>{}); }
  else {
    navigator.clipboard && navigator.clipboard.writeText(url).catch(()=>{});
    alert('لینک کارت کپی شد');
  }
}

// ───────────────────────── Theme picker interaction ─────────────────────────
let pendingPreset = null;
function pickPreset(key){
  pendingPreset = key;
  document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('selected', s.dataset.preset===key));
  const p = ACCENT_PRESETS[key];
  applyAccent(p.a, p.a2);
}
function confirmThemeChoice(){
  if(pendingPreset){
    try{ localStorage.setItem('moharez_card_accent', pendingPreset); }catch(e){}
  }
  showQuickToast('تم رنگی ذخیره شد ✓');
}
function showQuickToast(msg){
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:10px 18px;border-radius:12px;font-size:12.5px;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.3);';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

// ───────────────────────── vCard ─────────────────────────
function saveContact(){
  const data = CARD_DATA; if(!data) return;
  const name = data.name || 'Contact';
  const np = name.trim().split(' ');
  const n1 = np.slice(0,-1).join(' ') || np[0];
  const n2 = np.length>1 ? np[np.length-1] : '';
  const phones = (data.phones||[]).filter(p=>p&&p.value);
  const emails = (data.emails||[]).filter(e=>e&&e.value);
  const loc = data.location||{};
  const lines = ['BEGIN:VCARD','VERSION:3.0',`FN:${name}`,`N:${n2};${n1};;;`,`TITLE:${data.job||''}`];
  phones.forEach(p=>lines.push(`TEL;TYPE=${p.label}:${p.value}`));
  emails.forEach(e=>lines.push(`EMAIL;TYPE=${e.label}:${e.value}`));
  if(loc.city) lines.push(`ADR;TYPE=HOME:;;${loc.address||''};${loc.city};;;`);
  lines.push('END:VCARD');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n')], {type:'text/vcard'}));
  a.download = name.replace(/ /g,'_') + '.vcf';
  a.click();
}

// ───────────────────────── Page theme (light/dark) ─────────────────────────
function togglePageTheme(){
  document.body.classList.toggle('light');
  localStorage.setItem('moharez_card_theme', document.body.classList.contains('light') ? 'light' : 'dark');
  updatePageThemeIcon();
  applyCustomBackground();
}
function updatePageThemeIcon(){
  const isLight = document.body.classList.contains('light');
  document.querySelectorAll('.theme-icon').forEach(el=>{ el.innerHTML = isLight ? ICONS.moon : ICONS.sun; });
}
updatePageThemeIcon();

function wireUp(data){ /* reserved for future interactive wiring */ }
</script>
